services:
  - type: web
    name: rabbit-returns-api
    runtime: node
    rootDir: server
    # ensure devDependencies (types) are installed during build
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npx prisma generate && npm run build
    # start the compiled JS
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BENEFICIARY_NAME
        sync: false
      - key: BENEFICIARY_BANK
        sync: false
      - key: BENEFICIARY_ACCOUNT
        sync: false
      - key: BENEFICIARY_BRANCH
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "10"
# No Render-managed database block because you use Supabase


name: Apply Prisma schema (db push) and seed

on:
  push:
    branches:
      - main
      - lovable-site

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Push Prisma schema (create/alter tables without migration history)
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
        run: |
          echo "Applying prisma schema with db push"
          npx prisma db push --schema=prisma/schema.prisma

      - name: Seed database (optional)
        working-directory: server
        if: ${{ secrets.ADMIN_EMAIL && secrets.ADMIN_PASSWORD }}
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PGSSLMODE: require
        run: |
          echo "Seeding DB"
          npm run db:seed
